name: gotraining-queuebench

# One broker runs at a time (cmd/bench stops the other), each with the same
# CPU and memory limits. Nothing is published to the host.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: queuebench
      POSTGRES_PASSWORD: queuebench-local
      POSTGRES_DB: queuebench
    # synchronous_commit is chosen per connection by the profile.
    command: [postgres, -c, shared_buffers=512MB, -c, max_connections=100, -c, max_wal_size=4GB, -c, track_io_timing=on]
    cpus: 2
    mem_limit: 2g
    shm_size: 768m
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U queuebench -d queuebench]
      interval: 2s
      timeout: 5s
      retries: 40

  kafka:
    image: apache/kafka:4.1.0
    # The image's user cannot write to a fresh named volume.
    user: "0:0"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The rest of the 2g limit is page cache, which Kafka relies on.
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    cpus: 2
    mem_limit: 2g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 10s

  loadgen:
    build: .
    image: gotraining/queuebench-loadgen:local
    profiles: [load]
    user: "0:0"
    environment:
      PG_URL: postgres://queuebench:queuebench-local@postgres:5432/queuebench?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      GOMAXPROCS: "4"
    cpus: 4
    mem_limit: 1g
    volumes:
      - ${RESULTS_DIR:-./results}:/results

volumes:
  pg-data:
  kafka-data:
